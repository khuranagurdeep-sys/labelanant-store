<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Label Anant · Owner dashboard (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FBF8F3;--card:#fff;--ink:#2A1520;--soft:#6E5A63;--mute:#9A8890;--line:#ECE3D8;--rani:#9C1458;--deep:#5E0B35;--gold:#B8913F;--gold2:#E9D49A;--blush:#F7EEEF;--ok:#2E7D4F;--warn:#B26A00;--bad:#B3261E;--info:#2F5D8A}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.55 Jost,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
b,strong,th{font-weight:500}
h1,h2,h3{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;margin:0;line-height:1.15}
a{color:var(--rani)}
.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.demo-bar{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding:7px 14px;background:var(--deep);color:var(--gold2);font-size:12.5px;letter-spacing:.04em;text-align:center}
.demo-bar b{color:#fff;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px}
.demo-bar button{border:1px solid rgba(233,212,154,.5);background:none;color:var(--gold2);padding:2px 10px;cursor:pointer;font-size:12px}
/* login */
.login{min-height:calc(100vh - 34px);display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 60% 60% at 50% 40%,#fff,transparent 70%),var(--blush)}
.lbox{width:min(420px,100%);background:#fff;padding:36px 32px;border-top:3px solid var(--gold);box-shadow:0 30px 60px rgba(94,11,53,.12);text-align:center}
.lbox .alogo{height:84px;margin:0 auto 10px;display:block}
.lbox h1{font-size:28px;margin-bottom:4px}
.lbox p{color:var(--soft);margin:0 0 20px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;text-align:left;font-size:12.5px;color:var(--soft);letter-spacing:.04em}
.field input,.field select,.field textarea{min-height:42px;border:1px solid var(--line);background:#fff;padding:9px 12px;font-size:15px;color:var(--ink);border-radius:2px;width:100%}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(156,20,88,.25);border-color:var(--rani)}
.field small{color:var(--mute);font-size:12px;letter-spacing:0}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12.5px;min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border-radius:2px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--rani);color:var(--rani)}
.btn.pri{background:var(--rani);border-color:var(--rani);color:#fff}
.btn.pri:hover{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px}
.btn.danger{color:var(--bad);border-color:#E7C3C0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lk{border:0;background:none;padding:0;color:var(--rani);cursor:pointer;text-decoration:underline;font-size:inherit}
/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{position:sticky;top:34px;height:calc(100vh - 34px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:2px}
.side .alogo{height:62px;margin:0 0 4px 10px;align-self:flex-start}
.side .who{font-size:12px;color:var(--mute);margin:0 0 14px 12px;letter-spacing:.06em}
.nav-a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:2px;color:var(--ink);text-decoration:none;font-size:14.5px}
.nav-a:hover{background:var(--blush)}
.nav-a.on{background:var(--rani);color:#fff}
.nav-a .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold2);color:var(--deep);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:500}
.nav-a.on .cnt{background:#fff}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.main{padding:24px clamp(14px,2.6vw,36px) 80px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.phead h1{font-size:clamp(26px,2.6vw,34px)}
.phead p{margin:4px 0 0;color:var(--soft);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-size:11.5px;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px 20px}
.card h2{font-size:21px;margin-bottom:12px}
.card h2 small{font-family:Jost,sans-serif;font-size:12.5px;color:var(--mute);margin-left:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2w{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.chip input{width:auto!important;min-height:0!important;padding:0!important;margin:0;border:0!important;accent-color:var(--rani)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:2px;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.kpi:hover{border-color:var(--rani);box-shadow:0 6px 16px rgba(94,11,53,.08)}
.kpi span{font-size:12px;color:var(--soft);letter-spacing:.04em}
.kpi b{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;font-size:26px;line-height:1.2}
.kpi small{font-size:12px;color:var(--mute)}
.kpi.hot{border-left:3px solid var(--rani)}
.kpi.na{cursor:default}
.kpi.na:hover{border-color:var(--line);box-shadow:none}
.attn{display:flex;flex-direction:column}
.attn button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left}
.attn button:last-child{border-bottom:0}
.attn button:hover{background:var(--blush)}
.attn .ic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:500;color:#fff}
.attn .t{flex:1}
.attn .t small{display:block;color:var(--mute);font-size:12.5px}
.sev-critical{background:var(--bad)}.sev-serious{background:#C2410C}.sev-warning{background:var(--warn)}.sev-info{background:var(--info)}
/* tables */
.tbl-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);background:#FDFBF8;position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blush)}
tr.static{cursor:default}
td .sub{display:block;color:var(--mute);font-size:12px}
.wrap-cell{white-space:normal;min-width:220px}
.thumb{width:40px;height:50px;object-fit:cover;display:block;background:var(--blush)}
.ph{width:40px;height:50px;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:12px;font-size:12px;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:#EAF5EE}.b-warn{color:var(--warn);background:#FFF4E0}.b-bad{color:var(--bad);background:#FDECEA}.b-info{color:var(--info);background:#E9F0F7}.b-mute{color:var(--soft);background:#F2EEEA}.b-rani{color:var(--rani);background:var(--blush)}
.empty{padding:28px;text-align:center;color:var(--mute)}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(42,21,32,.35);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--bg);z-index:80;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(42,21,32,.15)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line)}
.dh h2{font-size:22px}
.dh .x{width:40px;height:40px;border:0;background:none;cursor:pointer;font-size:22px}
.db{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.df{padding:12px 20px;background:#fff;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;font-size:17px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:14px}
.kv dt{color:var(--soft)}
.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 12px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.timeline small{display:block;color:var(--mute)}
.items-mini{display:flex;flex-direction:column;gap:8px}
.items-mini div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.modal{position:fixed;left:50%;top:50%;width:min(520px,94vw);max-height:90vh;overflow:auto;transform:translate(-50%,-46%);opacity:0;pointer-events:none;background:#fff;z-index:90;padding:22px;transition:.25s;box-shadow:0 30px 70px rgba(42,21,32,.25);border-top:3px solid var(--gold)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h2{font-size:22px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;font-size:14px;opacity:0;transition:.3s;z-index:100;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--mute)}
.chart .grid-l{stroke:#EFE8E0;stroke-width:1}
.chart .base{stroke:#D8CCBE;stroke-width:1}
.chart .bar{fill:var(--rani);transition:opacity .15s}
.chart .bar.dim{opacity:.35}
.chart .line{fill:none;stroke:var(--rani);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:url(#ga)}
.chart .hair{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.chart .dot{fill:var(--rani);stroke:#fff;stroke-width:2;opacity:0}
.chart .lbl{font-size:12px;fill:var(--ink)}
.chart .val{font-size:12px;fill:var(--soft)}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(42,21,32,.12);padding:7px 10px;font-size:12.5px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
.tip b{display:block;font-size:14px;color:var(--ink)}
.tip span{color:var(--soft)}
details.tv summary{cursor:pointer;color:var(--soft);font-size:12.5px;margin-top:8px}
details.tv table{font-size:13px;margin-top:6px}
details.tv tr{cursor:default}
/* assistant */
.chat{display:flex;flex-direction:column;gap:12px;max-width:900px}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:88%;padding:12px 14px;border-radius:2px;font-size:14.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--rani);color:#fff}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.msg.ai table{margin-top:8px;font-size:13px}
.msg.ai tr{cursor:default}
.msg.ai th,.msg.ai td{padding:6px 8px}
.chatbar{display:flex;gap:8px;position:sticky;bottom:12px;background:var(--bg);padding:8px 0}
.chatbar input{flex:1;min-height:46px;border:1px solid var(--line);padding:0 14px;font-size:15px;background:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.note{padding:10px 14px;background:#FFF8E8;border-left:3px solid var(--gold);color:#6A4914;font-size:13.5px}
.note.info{background:#EEF3F8;border-color:var(--info);color:#244766}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.mtab{padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;font-size:14px;color:var(--soft);white-space:nowrap}
.mtab[aria-selected=true]{color:var(--rani);border-color:var(--rani)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.12)}
.imgs{display:flex;flex-wrap:wrap;gap:8px}
.imgs figure{position:relative;margin:0;width:72px}
.imgs img{width:72px;height:90px;object-fit:cover;display:block}
.imgs button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(255,255,255,.9);cursor:pointer;font-size:13px;line-height:1}
.mob-top,.bnav{display:none}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .mob-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:34px;z-index:50}
  .mob-top .alogo{height:44px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:10.5px;color:var(--ink);text-decoration:none;position:relative}
  .bnav a.on{color:var(--rani)}
  .bnav .cnt{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--rani);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .g2,.g3,.g2w{grid-template-columns:1fr}
  .demo-bar{position:relative}
  .mob-top{top:0!important}
  .main{padding-bottom:90px}
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:22px}
  .hide-m{display:none}
}
@media print{.demo-bar,.side,.mob-top,.bnav,.no-print{display:none!important}.shell{display:block}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8H4z"/><path d="M10 19v-5h4v5"/></symbol>
<symbol id="i-orders" viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></symbol>

<symbol id="i-stack" viewBox="0 0 24 24"><path d="M4 9l8-4 8 4-8 4z"/><path d="M4 13l8 4 8-4M4 17l8 4 8-4"/></symbol>

<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2.1 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2.1 1.2L10 21h4l.5-2.6c.8-.3 1.5-.7 2.1-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></symbol>

<symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4M6 12h10"/></symbol>

</svg>
<div class="demo-bar" role="note"><b>Demo mode</b><span>Sample data saved in this browser only. No real orders, payments or messages.</span><button data-act="reset">Reset demo data</button></div>

<div class="toast" id="toast" role="status"></div>

<script src="../assets/catalogue.js"></script>
<script src="../assets/demo.js"></script>
<script>
(function () {
"use strict";
const D = window.LA_DEMO; let db = D.load();
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const rs = n => "₹" + Math.round(n || 0).toLocaleString("en-IN");
const fmtD = t => t ? new Date(t).toLocaleDateString("en-IN", {day: "numeric", month: "short", year: "numeric"}) : "–";
const fmtDT = t => t ? new Date(t).toLocaleString("en-IN", {day: "numeric", month: "short", hour: "numeric", minute: "2-digit"}) : "–";
const ago = t => { const m = (Date.now() - Date.parse(t)) / 6e4; return m < 60 ? Math.max(1, m | 0) + " min ago" : m < 1440 ? (m / 60 | 0) + " h ago" : (m / 1440 | 0) + " d ago"; };
const save = () => { D.save(db); renderNav(); };
const P = id => D.product(db, id);
const C = id => db.customers.find(c => c.id === id);
const img = s => s ? (s.startsWith("data:") || s.startsWith("http") ? s : "../" + s) : "";
const thumb = p => p.images && p.images.length ? `<img class="thumb" src="${esc(img(p.images[0]))}" alt="" loading="lazy">` : `<span class="ph" style="background:linear-gradient(135deg,${esc(p.placeholder || "#ddd")},#fff)" aria-hidden="true"></span>`;
const maskPhone = p => p ? "+91 " + p.slice(0, 5) + " " + p.slice(5) : "";
const ST_BADGE = {placed: "b-warn", payment_failed: "b-bad", payment_verified: "b-info", confirmed: "b-info", processing: "b-info", packed: "b-info", shipped: "b-rani", delivered: "b-ok", cancelled: "b-mute", return_requested: "b-warn", return_approved: "b-warn", returned: "b-mute", refund_pending: "b-warn", refunded: "b-mute"};
const sBadge = s => `<span class="badge ${ST_BADGE[s] || "b-mute"}">${esc(D.STATUS[s] || s)}</span>`;
const stockBadge = p => p.stock == null ? '<span class="badge b-mute">Not set</span>' : p.stock === 0 ? '<span class="badge b-bad">Out of stock</span>' : p.stock <= (p.threshold ?? db.settings.lowStockDefault) ? `<span class="badge b-warn">Low · ${p.stock}</span>` : `<span class="badge b-ok">${p.stock} in stock</span>`;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); }
const TO_DISPATCH = ["payment_verified", "confirmed", "processing", "packed"];

/* ---------- login ---------- */
const authed = () => { try { return sessionStorage.getItem("la-admin-demo") === "1"; } catch (e) { return false; } };
function showApp() { $("#login").hidden = true; $("#app").hidden = false; route(); }
$("#loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const em = $("#le").value.trim(), pw = $("#lp").value;
  if (!/^\S+@\S+\.\S+$/.test(em)) { $("#lerr").textContent = "Enter a valid email address."; return; }
  if (pw !== "demo1234") { $("#lerr").textContent = "Wrong password. For this demo the password is demo1234."; return; }
  try { sessionStorage.setItem("la-admin-demo", "1"); } catch (err) {}
  D.log(db, "Owner", "Signed in (demo)"); save(); showApp();
});

/* ---------- navigation ---------- */
const PAGES = [["dashboard", "Dashboard", "i-home"], ["orders", "Orders", "i-orders"], ["products", "Products", "i-box"], ["inventory", "Inventory", "i-stack"], ["customers", "Customers", "i-users"], ["marketing", "Marketing", "i-mega"], ["reports", "Reports", "i-chart"], ["assistant", "Assistant", "i-spark"], ["settings", "Settings", "i-gear"]];
function counts() {
  return {orders: db.orders.filter(o => ["placed", ...TO_DISPATCH, "return_requested", "refund_pending"].includes(o.status)).length,
    inventory: db.notifications.filter(n => !n.read).length, customers: db.tickets.filter(t => t.status === "open").length,
    marketing: db.campaigns.filter(c => c.status === "pending_approval").length};
}
function renderNav() {
  const cur = (location.hash.slice(2).split("?")[0]) || "dashboard", n = counts();
  $("#nav").innerHTML = PAGES.map(([id, l, ic]) => `<a class="nav-a ${cur === id ? "on" : ""}" href="#/${id}"><svg class="icon"><use href="#${ic}"/></svg>${l}${n[id] ? `<span class="cnt">${n[id]}</span>` : ""}</a>`).join("");
  $("#bnav").innerHTML = PAGES.slice(0, 4).concat([["assistant", "Assistant", "i-spark"]]).map(([id, l, ic]) => `<a class="${cur === id ? "on" : ""}" href="#/${id}"><svg class="icon"><use href="#${ic}"/></svg>${l}${n[id] ? `<span class="cnt">${n[id]}</span>` : ""}</a>`).join("");
}
function q() { const s = location.hash.split("?")[1] || ""; return Object.fromEntries(new URLSearchParams(s)); }
function go(page, params) { location.hash = "#/" + page + (params ? "?" + new URLSearchParams(params) : ""); }
function route() {
  if (!authed()) { $("#app").hidden = true; $("#login").hidden = false; return; }
  const page = (location.hash.slice(2).split("?")[0]) || "dashboard";
  closeAll(); renderNav();
  (VIEWS[page] || VIEWS.dashboard)(q());
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- drawer & modal ---------- */
function drawer(title, body, foot) { $("#dTitle").textContent = title; $("#dBody").innerHTML = body; $("#dFoot").innerHTML = foot || ""; $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on"); $("#dBody").scrollTop = 0; }
function modal(html) { $("#modal").innerHTML = html; $("#modal").classList.add("on"); $("#scrim").classList.add("on"); const f = $("#modal input,#modal select,#modal textarea"); if (f) setTimeout(() => f.focus(), 50); }
function closeModal() { $("#modal").classList.remove("on"); if (!$("#drawer").classList.contains("on")) $("#scrim").classList.remove("on"); }
function closeAll() { $("#drawer").classList.remove("on"); $("#drawer").setAttribute("aria-hidden", "true"); $("#modal").classList.remove("on"); $("#scrim").classList.remove("on"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#modal").classList.contains("on")) closeModal(); else closeAll(); } });

/* ---------- charts (single series, rani, with hover tooltips and a table view) ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p / (v / p > 5 ? 2 : 1)) * p * (v / p > 5 ? 2 : 1); }
function tableView(rows, fmt, h1, h2) { return `<details class="tv"><summary>Show as table</summary><table><thead><tr class="static"><th>${esc(h1)}</th><th class="r">${esc(h2)}</th></tr></thead><tbody>${rows.map(r => `<tr class="static"><td>${esc(r.label)}</td><td class="r num">${esc(fmt(r.value))}</td></tr>`).join("")}</tbody></table></details>`; }
function lineChart(el, rows, fmt, unit) {
  const W = 640, H = 220, L = 54, R = 12, T = 14, B = 28, max = niceMax(Math.max(...rows.map(r => r.value), 1));
  const x = i => L + (rows.length < 2 ? 0 : i * (W - L - R) / (rows.length - 1)), y = v => T + (H - T - B) * (1 - v / max);
  const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.value).toFixed(1)}`).join(" ");
  const ticks = [0, .5, 1].map(f => f * max);
  const every = Math.max(1, Math.ceil(rows.length / 6));
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9C1458" stop-opacity=".16"/><stop offset="1" stop-color="#9C1458" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(t, true))}</text>`).join("")}
    <line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
    ${rows.map((r, i) => i % every === 0 || i === rows.length - 1 ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(r.short || r.label)}</text>` : "").join("")}
    <polygon class="area" points="${L},${y(0)} ${pts} ${x(rows.length - 1)},${y(0)}"/><polyline class="line" points="${pts}"/>
    <line class="hair" y1="${T}" y2="${y(0)}"/><circle class="dot" r="4.5"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>${tableView(rows, fmt, "Date", unit)}`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), hair = el.querySelector(".hair"), dot = el.querySelector(".dot");
  const show = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((sx - L) / ((W - L - R) / Math.max(1, rows.length - 1)))));
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.style.opacity = .5; dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(rows[i].value)); dot.style.opacity = 1;
    tip.innerHTML = ""; const b = document.createElement("b"); b.textContent = fmt(rows[i].value); const s = document.createElement("span"); s.textContent = rows[i].label + (rows[i].extra ? " · " + rows[i].extra : ""); tip.append(b, s);
    tip.style.opacity = 1; const px = x(i) * r.width / W; tip.style.left = Math.min(r.width - 150, Math.max(0, px - 60)) + "px"; tip.style.top = "0px";
  };
  const hide = () => { tip.style.opacity = 0; hair.style.opacity = 0; dot.style.opacity = 0; };
  svg.addEventListener("pointermove", show); svg.addEventListener("pointerleave", hide);
}
function barChart(el, rows, fmt, unit, onClick) {
  if (!rows.length) { el.innerHTML = '<div class="empty">No data for this period.</div>'; return; }
  const bh = 22, gap = 10, L = 150, R = 70, W = 640, H = rows.length * (bh + gap) + 6, max = Math.max(...rows.map(r => r.value), 1);
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}">${rows.map((r, i) => {
    const w = Math.max(2, (W - L - R) * r.value / max), yy = i * (bh + gap);
    return `<g class="bg" data-i="${i}" tabindex="0" style="cursor:${onClick ? "pointer" : "default"}"><rect x="0" y="${yy - 4}" width="${W}" height="${bh + 8}" fill="transparent"/><text class="lbl" x="${L - 10}" y="${yy + 15}" text-anchor="end">${esc(r.label.length > 22 ? r.label.slice(0, 21) + "…" : r.label)}</text><path class="bar" d="M${L},${yy} h${w - 4} a4,4 0 0 1 4,4 v${bh - 8} a4,4 0 0 1 -4,4 h-${w - 4} z"/><text class="val num" x="${L + w + 8}" y="${yy + 15}">${esc(fmt(r.value))}</text></g>`;
  }).join("")}</svg><div class="tip"></div></div>${tableView(rows, fmt, "Item", unit)}`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
  el.querySelectorAll(".bg").forEach(g => {
    const i = +g.dataset.i, on = () => { el.querySelectorAll(".bar").forEach((b, k) => b.classList.toggle("dim", k !== i)); tip.innerHTML = ""; const b = document.createElement("b"); b.textContent = fmt(rows[i].value); const s = document.createElement("span"); s.textContent = rows[i].label + (rows[i].extra ? " · " + rows[i].extra : ""); tip.append(b, s); tip.style.opacity = 1; const r = svg.getBoundingClientRect(); tip.style.left = Math.min(r.width - 170, L * r.width / W) + "px"; tip.style.top = (i * (bh + gap) * r.width / W - 44) + "px"; };
    const off = () => { el.querySelectorAll(".bar").forEach(b => b.classList.remove("dim")); tip.style.opacity = 0; };
    g.addEventListener("pointerenter", on); g.addEventListener("focus", on); g.addEventListener("pointerleave", off); g.addEventListener("blur", off);
    if (onClick) { g.addEventListener("click", () => onClick(rows[i])); g.addEventListener("keydown", e => { if (e.key === "Enter") onClick(rows[i]); }); }
  });
}
const fmtRs = (v, short) => short && v >= 1000 ? "₹" + (v >= 1e5 ? (v / 1e5).toFixed(1) + "L" : (v / 1000).toFixed(v >= 1e4 ? 0 : 1) + "k") : rs(v);
const fmtN = v => Math.round(v).toLocaleString("en-IN");

/* ---------- metrics ---------- */
function metrics(range) {
  const inR = o => D.inRange(o.createdAt, range);
  const all = db.orders.filter(inR), paid = all.filter(o => D.PAID.includes(o.status));
  const gross = paid.reduce((s, o) => s + o.subtotal, 0), disc = paid.reduce((s, o) => s + o.discount, 0);
  const refunds = db.orders.filter(o => o.refund && o.refund.status === "refunded" && D.inRange(o.refund.at || o.createdAt, range)).reduce((s, o) => s + o.refund.amount, 0);
  const revenue = paid.filter(o => o.status !== "refunded").reduce((s, o) => s + o.total, 0);
  const custs = db.customers.filter(c => D.inRange(c.createdAt, range));
  const segs = db.customers.map(c => D.segmentOf(db, c));
  return {all, paid, gross, disc, refunds, revenue, net: gross - disc - refunds, aov: paid.length ? (gross - disc) / paid.length : 0, newCust: custs.length, repeat: segs.filter(s => s.orders >= 2).length, buyers: segs.filter(s => s.orders >= 1).length};
}
const todayRev = () => D.paidOrders(db).filter(o => D.inRange(o.createdAt, "today") && o.status !== "refunded").reduce((s, o) => s + o.total, 0);
function attention() {
  const A = [], H = 36e5, now = Date.now();
  const awaitPay = db.orders.filter(o => o.status === "placed");
  const old = awaitPay.filter(o => now - Date.parse(o.createdAt) > 2 * H);
  if (awaitPay.length) A.push(["warning", awaitPay.length, `${awaitPay.length} order${awaitPay.length > 1 ? "s" : ""} awaiting payment`, old.length ? `${old.length} waiting more than 2 hours` : "Placed recently", () => go("orders", {status: "placed"})]);
  const fail = db.orders.filter(o => o.status === "payment_failed");
  if (fail.length) A.push(["serious", fail.length, `${fail.length} failed payment${fail.length > 1 ? "s" : ""}`, "Follow up or cancel", () => go("orders", {status: "payment_failed"})]);
  const disp = db.orders.filter(o => TO_DISPATCH.includes(o.status));
  const late = disp.filter(o => now - Date.parse(o.history.find(h => h.to === "payment_verified")?.at || o.createdAt) > 48 * H);
  if (disp.length) A.push([late.length ? "serious" : "info", disp.length, `${disp.length} paid order${disp.length > 1 ? "s" : ""} to dispatch`, late.length ? `${late.length} paid more than 2 days ago` : "All within 2 days", () => go("orders", {status: "dispatch"})]);
  const delayed = db.orders.filter(o => o.status === "shipped" && now - Date.parse(o.history.find(h => h.to === "shipped").at) > 5 * 864e5);
  if (delayed.length) A.push(["serious", delayed.length, `${delayed.length} shipment${delayed.length > 1 ? "s" : ""} in transit over 5 days`, "Check with the courier", () => go("orders", {status: "delayed"})]);
  const ret = db.orders.filter(o => o.status === "return_requested");
  if (ret.length) A.push(["warning", ret.length, `${ret.length} return request${ret.length > 1 ? "s" : ""}`, "Review eligibility", () => go("orders", {status: "return_requested"})]);
  const ref = db.orders.filter(o => o.status === "refund_pending" || (o.status === "cancelled" && o.refund && o.refund.status === "pending"));
  if (ref.length) A.push(["critical", ref.length, `${ref.length} refund${ref.length > 1 ? "s" : ""} to process`, "Customer is waiting for money back", () => go("orders", {status: "refunds"})]);
  const out = db.products.filter(p => p.status === "published" && p.stock === 0), low = db.products.filter(p => p.status === "published" && p.stock > 0 && p.stock <= (p.threshold ?? db.settings.lowStockDefault));
  if (out.length) A.push(["critical", out.length, `${out.length} product${out.length > 1 ? "s" : ""} out of stock`, out.slice(0, 2).map(p => p.name).join(", ") + (out.length > 2 ? "…" : ""), () => go("inventory", {f: "out"})]);
  if (low.length) A.push(["warning", low.length, `${low.length} product${low.length > 1 ? "s" : ""} running low`, low.slice(0, 2).map(p => p.name).join(", ") + (low.length > 2 ? "…" : ""), () => go("inventory", {f: "low"})]);
  const tk = db.tickets.filter(t => t.status === "open");
  if (tk.length) A.push(["warning", tk.length, `${tk.length} open customer issue${tk.length > 1 ? "s" : ""}`, tk.slice(0, 1).map(t => t.subject).join(""), () => go("customers", {tab: "tickets"})]);
  const pend = db.campaigns.filter(c => c.status === "pending_approval");
  if (pend.length) A.push(["info", pend.length, `${pend.length} campaign${pend.length > 1 ? "s" : ""} waiting for your approval`, pend[0].name, () => go("marketing")]);
  const unv = db.products.filter(p => p.real && !p.verified);
  if (unv.length) A.push(["info", unv.length, `${unv.length} live products have unverified prices and details`, "Sample data written from photos", () => go("products", {f: "unverified"})]);
  return A;
}

/* ---------- views ---------- */
const VIEWS = {};
let range = "30d";
VIEWS.dashboard = function () {
  const m = metrics(range), st = s => db.orders.filter(o => o.status === s && D.inRange(o.createdAt, range)).length;
  const live = db.products.filter(p => p.status === "published"), out = live.filter(p => p.stock === 0).length, low = live.filter(p => p.stock > 0 && p.stock <= (p.threshold ?? db.settings.lowStockDefault)).length;
  const k = (label, val, sub, go_, hot) => `<button class="kpi ${hot ? "hot" : ""} ${go_ ? "" : "na"}" ${go_ ? `data-go="${esc(go_)}"` : "disabled"}><span>${label}</span><b class="num">${val}</b>${sub ? `<small>${sub}</small>` : ""}</button>`;
  const rl = {today: "today", "7d": "last 7 days", "30d": "last 30 days", "90d": "last 90 days", all: "all time"}[range];
  $("#main").innerHTML = `<div class="phead"><div><h1>Good ${new Date().getHours() < 12 ? "morning" : new Date().getHours() < 17 ? "afternoon" : "evening"}</h1><p>Here is Label Anant at a glance · ${new Date().toLocaleDateString("en-IN", {weekday: "long", day: "numeric", month: "long"})}</p></div>
    <div class="chips" role="group" aria-label="Date range">${[["today", "Today"], ["7d", "7 days"], ["30d", "30 days"], ["90d", "90 days"], ["all", "All"]].map(([v, l]) => `<button class="chip" data-range="${v}" aria-pressed="${range === v}">${l}</button>`).join("")}</div></div>
  <div class="grid g2w" style="margin-bottom:16px">
    <div class="card"><h2>Needs your attention</h2><div class="attn" id="attn"></div></div>
    <div class="card"><h2>Today</h2><div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0">
      ${k("Revenue today", rs(todayRev()), D.paidOrders(db).filter(o => D.inRange(o.createdAt, "today")).length + " paid orders", "orders?range=today", 1)}
      ${k("Awaiting payment", db.orders.filter(o => o.status === "placed").length, "Not yet paid", "orders?status=placed")}
      ${k("To dispatch", db.orders.filter(o => TO_DISPATCH.includes(o.status)).length, "Paid, not shipped", "orders?status=dispatch", 1)}
      ${k("Open issues", db.tickets.filter(t => t.status === "open").length, "Customer support", "customers?tab=tickets")}</div></div>
  </div>
  <h2 style="font-size:22px;margin:22px 0 12px">Performance · ${rl}</h2>
  <div class="kpis">
    ${k("Revenue", rs(m.revenue), "Paid orders, after discounts", "reports?tab=sales", 1)}
    ${k("Orders", m.all.length, `${m.paid.length} paid`, "orders?range=" + range)}
    ${k("Average order value", rs(m.aov), "Paid orders", "reports?tab=sales")}
    ${k("Gross sales", rs(m.gross), "Before discounts", "reports?tab=sales")}
    ${k("Discounts", rs(m.disc), "Coupons used", "marketing?tab=coupons")}
    ${k("Refunds", rs(m.refunds), "Money returned", "orders?status=refunds")}
    ${k("Net sales", rs(m.net), "Gross − discounts − refunds", "reports?tab=sales")}
    ${k("Shipping charged", rs(0), "Free shipping", null)}
    ${k("Awaiting payment", st("placed"), "In this period", "orders?status=placed")}
    ${k("Delivered", st("delivered"), "In this period", "orders?status=delivered")}
    ${k("Cancelled", st("cancelled"), "In this period", "orders?status=cancelled")}
    ${k("Returns", db.orders.filter(o => ["return_requested", "return_approved", "returned"].includes(o.status)).length, "Open return cases", "orders?status=returns")}
    ${k("Active products", live.length, `${db.products.filter(p => p.status === "draft").length} drafts`, "products")}
    ${k("Out of stock", out, "Published products", "inventory?f=out", out > 0)}
    ${k("Low stock", low, "At or below threshold", "inventory?f=low")}
    ${k("Customers", db.customers.length, `${m.newCust} new in period`, "customers")}
    ${k("Repeat customers", m.repeat, `of ${m.buyers} buyers`, "customers?seg=repeat")}
    ${k("Conversion rate", "–", "Needs Google Analytics 4", null)}
    ${k("Gross margin", "–", "Add cost prices to see this", null)}
  </div>
  <div class="grid g2">
    <div class="card"><h2>Revenue by day <small>${rl}</small></h2><div id="c1"></div></div>
    <div class="card"><h2>Revenue by collection <small>${rl}</small></h2><div id="c2"></div></div>
    <div class="card"><h2>Bestsellers <small>units sold · ${rl}</small></h2><div id="c3"></div></div>
    <div class="card"><h2>Revenue by state <small>${rl}</small></h2><div id="c4"></div></div>
  </div>`;
  const at = attention();
  $("#attn").innerHTML = at.length ? at.map((a, i) => `<button data-attn="${i}"><span class="ic sev-${a[0]}" aria-label="${a[0]}">${a[1]}</span><span class="t">${esc(a[2])}<small>${esc(a[3])}</small></span><span aria-hidden="true">›</span></button>`).join("") : '<div class="empty">Nothing needs attention right now.</div>';

function drawImgs() { const el = $("#imgs"); if (el) el.innerHTML = editImages.map((s, i) => `<figure><img src="${esc(img(s))}" alt=""><button type="button" data-rmimg="${i}" aria-label="Remove photo">×</button></figure>`).join("") || '<span style="color:var(--mute);font-size:13px">No photos yet</span>'; }
function addImages(files) {
  [...files].slice(0, 6 - editImages.length).forEach(f => {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return toast(f.name + ": only JPG, PNG or WebP");
    if (f.size > 5 * 1024 * 1024) return toast(f.name + " is larger than 5 MB");
    const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 800 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = im.width * s | 0; c.height = im.height * s | 0; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); editImages.push(c.toDataURL("image/jpeg", .82)); drawImgs(); }; im.onerror = () => toast(f.name + " could not be read"); im.src = r.result; }; r.readAsDataURL(f);
  });
}
function saveProduct(existingId, newId) {
  const g = k => { const el = $("#f-" + k); return el ? el.value.trim() : ""; };
  $$("#pform .field").forEach(f => f.classList.remove("bad"));
  const errs = [];
  const bad = (k, m) => { const f = $(`[data-f="${k}"]`); if (f) f.classList.add("bad"); errs.push(m); };
  const name = g("name"), sku = g("sku").toUpperCase(), price = Number(g("price")), stock = g("stock") === "" ? null : Number(g("stock")), mrp = g("mrp") === "" ? null : Number(g("mrp")), thr = Number(g("threshold") || 0);
  if (name.length < 3) bad("name", "Enter a product name");
  if (!/^[A-Z0-9-]{3,30}$/.test(sku)) bad("sku", "SKU: 3–30 letters, numbers or dashes");
  else if (db.products.find(p => p.sku === sku && p.id !== existingId)) bad("sku", "This SKU is already used");
  if (!Number.isInteger(price) || price <= 0) bad("price", "Enter a price in whole rupees");
  if (mrp != null && (!Number.isInteger(mrp) || mrp < price)) bad("mrp", "MRP must be a whole number not lower than the price");
  if (stock != null && (!Number.isInteger(stock) || stock < 0)) bad("stock", "Stock must be 0 or more");
  if (!Number.isInteger(thr) || thr < 0) bad("threshold", "Alert level must be 0 or more");
  const status = g("status"); if (status === "scheduled" && !g("launchAt")) bad("launchAt", "Choose a launch date for a scheduled product");
  const cols = $$('#pform input[name=col]:checked').map(i => i.value); if (!cols.length) errs.push("Choose at least one collection");
  if (g("video") && !/^https:\/\//.test(g("video"))) bad("video", "Video link must start with https://");
  if (errs.length) { $("#perr").textContent = errs.join(". ") + "."; return; }
  const p = existingId ? P(existingId) : {id: newId, real: false, verified: false, createdAt: new Date().toISOString(), n: 0, f: null, placeholder: "#C9A24E", variants: []};
  const before = {price: p.price, stock: p.stock};
  Object.assign(p, {name, sku, price, mrp, collections: cols, colours: $$('#pform input[name=colour]:checked').map(i => i.value), occasions: $$('#pform input[name=occ]:checked').map(i => i.value),
    category: g("category"), fabric: g("fabric"), pattern: g("pattern"), embroidery: g("embroidery"), components: g("components"), top: g("top"), bottom: g("bottom"), dupatta: g("dupatta"), care: g("care"), desc: g("desc"),
    gst: g("gst") ? Number(g("gst")) : null, threshold: thr, status, launchAt: g("launchAt") ? new Date(g("launchAt")).toISOString() : null, video: g("video"), shipping: g("shipping"), returnable: g("returnable") === "" ? null : g("returnable") === "yes",
    seoTitle: g("seoTitle"), seoDesc: g("seoDesc"), tags: g("tags").split(",").map(t => t.trim()).filter(Boolean), images: editImages.slice()});
  if ($("#f-verified")) p.verified = $("#f-verified").checked;
  if (!existingId) { p.stock = 0; db.products.unshift(p); if (stock) D.adjustStock(db, p.id, stock, "Opening stock", "Owner"); D.log(db, "Owner", "Added product", p.id); }
  else { if (stock != null && stock !== before.stock) D.adjustStock(db, p.id, stock - (before.stock || 0), "Stock count corrected in product editor", "Owner"); if (before.price !== price) D.log(db, "Owner", `Price changed ${rs(before.price)} → ${rs(price)}`, p.id); D.log(db, "Owner", "Edited product", p.id); }
  save(); closeAll(); toast(existingId ? "Product saved" : "Product added"); VIEWS.products(q());
}

/* reports */
function salesRows(range) {
  const paid = D.paidOrders(db).filter(o => D.inRange(o.createdAt, range));
  const byDay = {}, byMonth = {}, byProd = {}, byCol = {}, byPay = {};
  paid.forEach(o => {
    const d = o.createdAt.slice(0, 10), m = o.createdAt.slice(0, 7);
    [[byDay, d], [byMonth, m]].forEach(([t, k]) => { t[k] = t[k] || {orders: 0, gross: 0, discount: 0, net: 0}; t[k].orders++; t[k].gross += o.subtotal; t[k].discount += o.discount; t[k].net += o.total; });
    byPay[o.payment.method] = byPay[o.payment.method] || {orders: 0, value: 0}; byPay[o.payment.method].orders++; byPay[o.payment.method].value += o.total;
    o.items.forEach(it => { byProd[it.pid] = byProd[it.pid] || {units: 0, value: 0}; byProd[it.pid].units += it.qty; byProd[it.pid].value += it.qty * it.price; const p = P(it.pid); const c = p ? p.collections[0] : "other"; byCol[c] = byCol[c] || {units: 0, value: 0}; byCol[c].units += it.qty; byCol[c].value += it.qty * it.price; });
  });
  return {
    daily: [["Date", "Orders", "Gross", "Discount", "Net"], ...Object.entries(byDay).sort().map(([k, v]) => [k, v.orders, v.gross, v.discount, v.net])],
    monthly: [["Month", "Orders", "Gross", "Discount", "Net"], ...Object.entries(byMonth).sort().map(([k, v]) => [k, v.orders, v.gross, v.discount, v.net])],
    product: [["Product", "SKU", "Units", "Revenue"], ...Object.entries(byProd).sort((a, b) => b[1].value - a[1].value).map(([k, v]) => [(P(k) || {name: k}).name, (P(k) || {sku: k}).sku, v.units, v.value])],
    collection: [["Collection", "Units", "Revenue"], ...Object.entries(byCol).sort((a, b) => b[1].value - a[1].value).map(([k, v]) => [D.COLS[k] || k, v.units, v.value])],
    payment: [["Payment method", "Orders", "Value"], ...Object.entries(byPay).map(([k, v]) => [k, v.orders, v.value])],
    returns: [["Order", "Date", "Status", "Reason", "Refund"], ...db.orders.filter(o => o.returnReason || o.refund).map(o => [o.id, o.createdAt.slice(0, 10), D.STATUS[o.status], o.returnReason || "Cancelled", o.refund ? o.refund.amount + " (" + o.refund.status + ")" : ""])]
  };
}
function invRows() {

function custRows() {

    if (d.camp === "submit") { c.status = "pending_approval"; D.log(db, "Owner", "Submitted campaign for approval", c.id); }
    if (d.camp === "approve") { c.status = "approved"; c.approvedBy = "Owner"; c.approvedAt = new Date().toISOString(); D.log(db, "Owner", "Approved campaign", c.id); }
    if (d.camp === "send") { const aud = D.audience(db, c.segment).filter(x => c.channel === "WhatsApp" ? x.consent.whatsapp : x.consent.email); if (!aud.length) return toast("No opted-in customers in this audience"); return modal(`<h2>Send "${esc(c.name)}"?</h2><p>${aud.length} opted-in customers by ${esc(c.channel)}.</p><div class="card" style="background:var(--blush)">${esc(c.message)}</div><p class="note info" style="margin-top:10px">Demo: no messages are actually sent. Delivery reports appear once the channel is connected.</p><div class="df" style="padding:12px 0 0;background:none;border:0"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-sendc="${c.id}">Send (demo)</button></div>`); }
    save(); VIEWS.marketing(q()); return;
  }
  if (d.sendc) { const c = db.campaigns.find(x => x.id === d.sendc), aud = D.audience(db, c.segment).filter(x => c.channel === "WhatsApp" ? x.consent.whatsapp : x.consent.email); c.status = "sent"; c.sentAt = new Date().toISOString(); c.recipients = aud.length; c.delivered = 0; D.log(db, "Owner", `Sent campaign to ${aud.length} (demo)`, c.id); save(); closeModal(); toast("Campaign marked as sent (demo)"); VIEWS.marketing(q()); return; }
  if (d.toggleCoupon) { const c = db.coupons.find(x => x.code === d.toggleCoupon); c.active = !c.active; D.log(db, "Owner", `Coupon ${c.active ? "on" : "off"}`, c.code); save(); VIEWS.marketing(q()); return; }
  if (d.ask) { if (location.hash.indexOf("assistant") < 0) go("assistant"); setTimeout(() => ask(d.ask), 30); return; }
  if (d.approveDesc) { const p = P(d.approveDesc), v = $("#draftDesc").value.trim(); if (v.length < 20) return toast("Description is too short"); p.desc = v; D.log(db, "Owner", "Approved assistant description", p.id); save(); toast("Description saved to " + p.id); return; }
  const act = d.act; if (!act) return;
  if (act === "close") closeAll();
  if (act === "mclose") closeModal();
  if (act === "logout") { try { sessionStorage.removeItem("la-admin-demo"); } catch (err) {} route(); }
  if (act === "reset") { modal(`<h2>Reset demo data?</h2><p>All demo products, orders, customers and changes in this browser are replaced with fresh sample data.</p><div class="df" style="padding:12px 0 0;background:none;border:0"><button class="btn" data-act="mclose">Cancel</button><button class="btn danger" data-act="do-reset">Reset</button></div>`); }
  if (act === "do-reset") { db = D.reset(); CHAT = []; closeAll(); toast("Fresh demo data loaded"); route(); }
  if (act === "more") { const cur = (location.hash.slice(2).split("?")[0]) || "dashboard"; modal(`<h2>Menu</h2><div style="display:flex;flex-direction:column;gap:6px">${PAGES.map(([id, l]) => `<a class="btn" style="justify-content:flex-start" href="#/${id}" ${cur === id ? 'aria-current="page"' : ""}>${l}</a>`).join("")}<a class="btn" style="justify-content:flex-start" href="../index.html?demo=1" target="_blank" rel="noopener">Shop in demo mode</a><button class="btn" style="justify-content:flex-start" data-act="logout">Sign out</button></div>`); }
  if (act === "new-product") openProduct(null);
  if (act === "bulk-price") bulkPrice();
  if (act === "export-products") exportRows("Products", productRows(), "xlsx");
  if (act === "export-products-csv") exportRows("Products", productRows(), "csv");
  if (act === "export-orders") exportRows("Orders", orderRows(), "xlsx");
  if (act === "export-customers") exportRows("Customers", custRows().list, "xlsx");
  if (act === "export-ledger") exportRows("Stock ledger", invRows().ledger, "xlsx");
  if (act === "export-stock") exportRows("Stock", invRows().stock, "xlsx");
  if (act === "refund-cancel") { D.refundCancelled(db, d.oid, "Owner"); save(); toast("Refund processed (simulated)"); openOrder(d.oid); refreshList(); }
  if (act === "new-coupon") modal(`<h2>New coupon</h2><div class="form"><div class="field"><label for="cc">Code</label><input id="cc" placeholder="e.g. WEDDING10" style="text-transform:uppercase"></div><div class="field"><label for="ct">Type</label><select id="ct"><option value="percent">Percent off</option><option value="flat">Rupees off</option></select></div><div class="field"><label for="cv">Value</label><input id="cv" type="number" min="1"></div><div class="field"><label for="cm">Minimum order (₹)</label><input id="cm" type="number" min="0" value="0"></div><div class="field"><label for="ce">Expires</label><input id="ce" type="date"></div><div class="field"><label for="cl">Usage limit</label><input id="cl" type="number" min="1" value="100"></div><p class="ferr full" id="coerr"></p></div><div class="df" style="padding:12px 0 0;background:none;border:0"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="save-coupon">Create coupon</button></div>`);
  if (act === "save-coupon") { const code = $("#cc").value.trim().toUpperCase(), type = $("#ct").value, val = Number($("#cv").value), min = Number($("#cm").value || 0), exp = $("#ce").value, lim = Number($("#cl").value || 0); const er = !/^[A-Z0-9]{4,15}$/.test(code) ? "Code: 4–15 letters or numbers." : db.coupons.find(c => c.code === code) ? "That code already exists." : !Number.isInteger(val) || val <= 0 ? "Enter a whole-number value." : type === "percent" && val > 50 ? "Percent discounts above 50% are blocked in this demo." : !exp || Date.parse(exp) < Date.now() ? "Choose an expiry date in the future." : !Number.isInteger(lim) || lim < 1 ? "Usage limit must be at least 1." : ""; if (er) { $("#coerr").textContent = er; return; } db.coupons.unshift({code, type, value: val, minOrder: min, expires: new Date(exp + "T23:59:59").toISOString(), limit: lim, used: 0, active: true, note: "Created by owner (demo)"}); D.log(db, "Owner", "Created coupon", code); save(); closeModal(); toast(code + " is live in the demo shop"); VIEWS.marketing({tab: "coupons"}); }
  if (act === "new-campaign") modal(`<h2>New campaign</h2><div class="form"><div class="field full"><label for="cn">Name</label><input id="cn" placeholder="e.g. Kalamkari launch"></div><div class="field"><label for="cch">Channel</label><select id="cch"><option>WhatsApp</option><option>Email</option></select></div><div class="field"><label for="cs">Audience</label><select id="cs">${Object.entries(D.SEGMENTS).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div><div class="field full"><label for="cmsg">Message</label><textarea id="cmsg" maxlength="600">New at Label Anant: … Reply STOP to opt out.</textarea><small>WhatsApp marketing messages must use a template approved by Meta and include an opt-out.</small></div><p class="full" id="caud" style="color:var(--soft);margin:0"></p><p class="ferr full" id="cerr2"></p></div><div class="df" style="padding:12px 0 0;background:none;border:0"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="save-campaign">Save draft</button></div>`) || setTimeout(() => { const upd = () => { const n = D.audience(db, $("#cs").value).filter(x => $("#cch").value === "WhatsApp" ? x.consent.whatsapp : x.consent.email).length; $("#caud").textContent = `${n} customers in this audience have opted in to ${$("#cch").value}.`; }; $("#cs").addEventListener("change", upd); $("#cch").addEventListener("change", upd); upd(); }, 20);
  if (act === "save-campaign") { const n = $("#cn").value.trim(), m = $("#cmsg").value.trim(); if (n.length < 3 || m.length < 20) { $("#cerr2").textContent = "Give the campaign a name and a message of at least 20 characters."; return; } if ($("#cch").value === "WhatsApp" && !/stop/i.test(m)) { $("#cerr2").textContent = "Add an opt-out line, e.g. \"Reply STOP to opt out\"."; return; } db.campaigns.unshift({id: "CP-" + (++db.seq.campaign), name: n, channel: $("#cch").value, segment: $("#cs").value, message: m, status: "draft", createdAt: new Date().toISOString(), approvedBy: "", approvedAt: null, sentAt: null, recipients: 0, delivered: 0, clicks: 0, orders: 0, revenue: 0, demo: true}); D.log(db, "Owner", "Created campaign draft", n); save(); closeModal(); toast("Draft saved. Submit it for approval when ready."); VIEWS.marketing({tab: "campaigns"}); }
  if (act === "draft-to-campaign") { const m = $("#campDraft").value.trim(); db.campaigns.unshift({id: "CP-" + (++db.seq.campaign), name: "New arrivals (assistant draft)", channel: "WhatsApp", segment: "whatsapp", message: m, status: "draft", createdAt: new Date().toISOString(), approvedBy: "", approvedAt: null, sentAt: null, recipients: 0, delivered: 0, clicks: 0, orders: 0, revenue: 0, demo: true}); save(); toast("Saved as a draft campaign"); }
  if (act === "save-ann") { const v = db.settings.announcements.map((_, i) => $("#an" + i).value.trim()).filter(Boolean); if (!v.length) return toast("Keep at least one message"); db.settings.announcements = v; D.log(db, "Owner", "Updated announcement bar"); save(); toast("Announcement saved; it shows in the demo shop"); }
  if (act === "save-home") { db.settings.homeCollection = $("#hc").value; $$("[data-colfeat]").forEach(c => { db.collections.find(x => x.id === c.dataset.colfeat).featured = c.checked; }); D.log(db, "Owner", "Updated homepage"); save(); toast("Homepage saved; it shows in the demo shop"); }
  if (act === "save-store") { const wa = $("#s-wa").value.replace(/\D/g, ""), gst = $("#s-gst").value.trim().toUpperCase(), em = $("#s-email").value.trim(), low = Number($("#s-low").value); const er = !/^91[6-9]\d{9}$/.test(wa) ? "WhatsApp number must be 91 followed by a 10-digit mobile number." : gst && !/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(gst) ? "GSTIN format is not valid." : em && !/^\S+@\S+\.\S+$/.test(em) ? "Email is not valid." : !Number.isInteger(low) || low < 0 ? "Low-stock alert must be 0 or more." : ""; if (er) { $("#serr2").textContent = er; return; } Object.assign(db.settings, {storeName: $("#s-name").value.trim() || "Label Anant", whatsapp: wa, address: $("#s-addr").value.trim(), email: em, gstin: gst, lowStockDefault: low}); D.log(db, "Owner", "Updated store details"); save(); toast("Saved"); }
  if (act === "save-policies") { Object.keys(db.settings.policies).forEach(k => db.settings.policies[k] = $("#pol-" + k).value); D.log(db, "Owner", "Updated policy drafts"); save(); toast("Drafts saved"); }
  if (act === "backup") download("label-anant-demo-backup-" + new Date().toISOString().slice(0, 10) + ".json", new Blob([JSON.stringify(db)], {type: "application/json"}));
  if (act === "new-ticket") modal(`<h2>Log a customer issue</h2><div class="form"><div class="field full"><label for="tc">Customer</label><select id="tc">${db.customers.slice(0, 100).map(c => `<option value="${c.id}">${esc(c.name)} · ${esc(c.city)}</option>`).join("")}</select></div><div class="field full"><label for="ts2">Issue</label><input id="ts2" placeholder="e.g. Asked about dupatta length"></div><p class="ferr full" id="terr"></p></div><div class="df" style="padding:12px 0 0;background:none;border:0"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="save-ticket">Save</button></div>`);
  if (act === "save-ticket") { const s = $("#ts2").value.trim(); if (s.length < 5) { $("#terr").textContent = "Describe the issue."; return; } db.tickets.unshift({id: "T-" + (++db.seq.ticket), customerId: $("#tc").value, orderId: "", subject: s.slice(0, 160), status: "open", createdAt: new Date().toISOString(), messages: [{at: new Date().toISOString(), by: "Owner", text: s}], demo: true}); save(); closeModal(); ticketsView({tab: "tickets"}); }
});
document.addEventListener("click", e => { const b = e.target.closest("[data-xlsx],[data-csv]"); if (!b) return; const t = b.dataset.xlsx || b.dataset.csv; exportRows(t, RPT[t], b.dataset.xlsx ? "xlsx" : "csv"); });
document.addEventListener("submit", e => { if (!["chatf", "loginForm"].includes(e.target.id)) e.preventDefault(); });
window.addEventListener("storage", e => { if (e.key === D.KEY) { db = D.load(); route(); } });
route();
})();
</script>
